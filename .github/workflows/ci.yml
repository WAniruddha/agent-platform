name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=src python -m pytest -q
      - run: python -m compileall -q src scripts
      - run: cp .env.example .env && docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate ephemeral test credentials
        run: python3 scripts/init_env.py
      - name: Start full control plane
        run: docker compose up -d --build
      - name: End-to-end worker smoke test
        run: bash scripts/smoke.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=150 db migrate api worker reaper
      - name: Stop test containers
        if: always()
        run: docker compose down
